<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Mexican Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001824" />
      <stop offset="100%" stop-color="#000B10" />
    </linearGradient>

    <!-- Warm Amber Fire Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B700" />
      <stop offset="100%" stop-color="#CA6702" />
    </linearGradient>

    <!-- Drop Shadow Filter for Vector Elements -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle Badge -->
  <rect 
    x="16" 
    y="16" 
    width="480" 
    height="480" 
    rx="112" 
    fill="url(#bgGrad)" 
    stroke="url(#amberGrad)" 
    stroke-width="16" 
  />

  <!-- Inner Subtle Accent Border -->
  <rect 
    x="32" 
    y="32" 
    width="448" 
    height="448" 
    rx="96" 
    fill="none" 
    stroke="#EE9B00" 
    stroke-width="2" 
    stroke-opacity="0.35" 
  />

  <!-- Top Flame Motif -->
  <g transform="translate(256, 75)" filter="url(#shadow)">
    <!-- Central Flame -->
    <path 
      d="M 0,-32 C 12,-18 20,-4 14,14 C 10,26 0,30 0,30 C 0,30 -10,26 -14,14 C -20,-4 -12,-18 0,-32 Z" 
      fill="url(#amberGrad)" 
    />
    <!-- Left Accent Flame -->
    <path 
      d="M -12,-6 C -6,2 -4,14 -10,22 C -13,26 -20,26 -20,26 C -20,26 -22,18 -18,10 C -15,4 -16,-2 -12,-6 Z" 
      fill="#AE2012" 
    />
    <!-- Right Accent Flame -->
    <path 
      d="M 12,-6 C 6,2 4,14 10,22 C 13,26 20,26 20,26 C 20,26 22,18 18,10 C 15,4 16,-2 12,-6 Z" 
      fill="#AE2012" 
    />
    <!-- Inner Core Spark -->
    <circle cx="0" cy="14" r="5" fill="#FAF5E8" />
  </g>

  <!-- Group for Logo Typography -->
  <g filter="url(#shadow)">
    <!-- EL Shadow -->
    <text 
      x="125" 
      y="214" 
      fill="#000000" 
      font-family="'Lilita One', 'Impact', 'Arial Black', sans-serif" 
      font-size="110" 
      font-weight="900" 
      text-anchor="middle" 
      transform="rotate(-7, 125, 214)"
    >
      EL
    </text>
    <!-- EL Gold Outline -->
    <text 
      x="122" 
      y="211" 
      fill="#EE9B00" 
      font-family="'Lilita One', 'Impact', 'Arial Black', sans-serif" 
      font-size="110" 
      font-weight="900" 
      text-anchor="middle" 
      transform="rotate(-7, 122, 211)"
    >
      EL
    </text>
    <!-- EL Fore Text -->
    <text 
      x="118" 
      y="207" 
      fill="#FAF5E8" 
      font-family="'Lilita One', 'Impact', 'Arial Black', sans-serif" 
      font-size="110" 
      font-weight="900" 
      text-anchor="middle" 
      transform="rotate(-7, 118, 207)"
    >
      EL
    </text>

    <!-- FLORIPA Ribbon Banner Shadow -->
    <path 
      d="M 198,144 
         L 412,144 
         C 424,144 424,148 434,148 
         C 428,160 428,172 434,184 
         L 434,196 
         C 428,208 428,220 434,232 
         L 220,232 
         C 208,232 208,228 198,228 
         C 204,216 204,204 198,192 
         L 198,180 
         C 204,168 204,156 198,144 Z" 
      fill="#000000" 
      transform="translate(4, 5)" 
    />
    <!-- FLORIPA Ribbon Banner -->
    <path 
      d="M 198,144 
         L 412,144 
         C 424,144 424,148 434,148 
         C 428,160 428,172 434,184 
         L 434,196 
         C 428,208 428,220 434,232 
         L 220,232 
         C 208,232 208,228 198,228 
         C 204,216 204,204 198,192 
         L 198,180 
         C 204,168 204,156 198,144 Z" 
      fill="url(#amberGrad)" 
      stroke="#FAF5E8" 
      stroke-width="3" 
    />
    <!-- FLORIPA Banner Text -->
    <text 
      x="316" 
      y="198" 
      fill="#001219" 
      font-family="'Sora', 'Outfit', 'Montserrat', sans-serif" 
      font-size="34" 
      font-weight="900" 
      letter-spacing="5" 
      text-anchor="middle"
    >
      FLORIPA
    </text>

    <!-- CHICANO Shadow -->
    <text 
      x="259" 
      y="346" 
      fill="#000000" 
      font-family="'Lilita One', 'Impact', 'Arial Black', sans-serif" 
      font-size="112" 
      font-weight="900" 
      letter-spacing="2" 
      text-anchor="middle"
    >
      CHICANO
    </text>
    <!-- CHICANO Amber Shadow -->
    <text 
      x="256" 
      y="343" 
      fill="#EE9B00" 
      font-family="'Lilita One', 'Impact', 'Arial Black', sans-serif" 
      font-size="112" 
      font-weight="900" 
      letter-spacing="2" 
      text-anchor="middle"
    >
      CHICANO
    </text>
    <!-- CHICANO White Text -->
    <text 
      x="252" 
      y="339" 
      fill="#FAF5E8" 
      font-family="'Lilita One', 'Impact', 'Arial Black', sans-serif" 
      font-size="112" 
      font-weight="900" 
      letter-spacing="2" 
      text-anchor="middle"
    >
      CHICANO
    </text>

    <!-- MEXICAN FOOD Subtitle -->
    <g transform="translate(256, 410)">
      <!-- Left decorative star -->
      <polygon points="-160,0 -155,-5 -150,0 -155,5" fill="#EE9B00" />
      <text 
        x="0" 
        y="5" 
        fill="#0A9396" 
        font-family="'Sora', 'Outfit', sans-serif" 
        font-size="21" 
        font-weight="900" 
        letter-spacing="7" 
        text-anchor="middle"
      >
        MEXICAN FOOD
      </text>
      <!-- Right decorative star -->
      <polygon points="160,0 155,-5 150,0 155,5" fill="#EE9B00" />
    </g>
  </g>
</svg>
